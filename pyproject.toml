[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkcite"
version = "0.2.0"
description = "Structure-aware chunking for RAG, with verifiable citations and a no-LLM retrieval eval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "hydope" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rag", "chunking", "citations", "evaluation", "retrieval", "pdf"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
dev = ["pytest>=8"]

[project.scripts]
chunkcite = "chunkcite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
